<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전시 큐레이션</title>
<style>
  :root {
    color-scheme: light;
    --paper: #FFFFFF;
    --ground: #EFEFF1;
    --ink: #111113;
    --ink-2: #56565E;
    --ink-3: #63636D;
    --rule: #DCDCE1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #171719;
      --ground: #0C0C0E;
      --ink: #F4F4F6;
      --ink-2: #AFAFB8;
      --ink-3: #9A9AA4;
      --rule: #2C2C33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: var(--ground);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 640px; }
  h1 { margin: 0 0 6px; font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
  .lede { margin: 0 0 28px; color: var(--ink-2); font-size: 15px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.card {
    display: block;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 10px;
    transition: border-color .14s ease;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--ink); }
  .tag {
    display: inline-block;
    margin-bottom: 5px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--paper);
    background: var(--ink);
    border-radius: 3px;
  }
  .name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .note { margin-top: 4px; font-size: 13px; color: var(--ink-3); }
  footer { margin-top: 26px; font-size: 12px; color: var(--ink-3); }
</style>
</head>
<body>
<main>
  <h1>전시 큐레이션</h1>
  <p class="lede">서울에서 열리는 전시 18개. 세 가지 버전으로 만들어 두었습니다.</p>
  <ul>
    <li><a class="card" href="/a/">
      <span class="tag">A</span>
      <div class="name">날짜 또는 장소, 하나만</div>
      <div class="note">달력과 지도 중 한쪽만 골라집니다. 지하철 노선은 표시되지 않습니다.</div>
    </a></li>
    <li><a class="card" href="/b/">
      <span class="tag">B</span>
      <div class="name">날짜와 장소, 여러 개</div>
      <div class="note">날짜도 장소도 겹쳐 고를 수 있습니다. 지도에 지하철 노선이 표시됩니다.</div>
    </a></li>
    <li><a class="card" href="/c/">
      <span class="tag">C</span>
      <div class="name">시간과 노선까지</div>
      <div class="note">관람 시간대를 고르고, 지하철 노선을 눌러 그 주변 전시만 볼 수 있습니다.</div>
    </a></li>
  </ul>
  <footer>관람료와 기간은 방문 전 각 기관 페이지에서 다시 확인하세요.</footer>
</main>
</body>
</html>
