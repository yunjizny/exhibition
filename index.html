<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전시 큐레이션</title>
<style>
  :root {
    color-scheme: light;
    --paper: #FFFFFF;
    --ground: #EFEFF1;
    --ink: #111113;
    --ink-2: #56565E;
    --ink-3: #63636D;
    --rule: #DCDCE1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --paper: #171719;
      --ground: #0C0C0E;
      --ink: #F4F4F6;
      --ink-2: #AFAFB8;
      --ink-3: #9A9AA4;
      --rule: #2C2C33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: var(--ground);
    color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.6;
    word-break: keep-all;
  }
  main { width: 100%; max-width: 640px; }
  h1 { margin: 0 0 6px; font-size: 30px; font-weight: 800; letter-spacing: -.03em; }
  .lede { margin: 0 0 28px; color: var(--ink-2); font-size: 15px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  a.card {
    display: block;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 10px;
    transition: border-color .14s ease;
  }
  a.card:hover, a.card:focus-visible { border-color: var(--ink); }
  .tag {
    display: inline-block;
    margin-bottom: 5px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .1em;
    color: var(--paper);
    background: var(--ink);
    border-radius: 3px;
  }
  .name { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
</style>
</head>
<body>
<main>
  <h1>전시 큐레이션</h1>
  <p class="lede">서울에서 열리는 전시를 소개합니다.</p>
  <ul>
    <li><a class="card" href="/a/">
      <span class="tag">A</span>
      <div class="name">MVP ver.1</div>
    </a></li>
    <li><a class="card" href="/b/">
      <span class="tag">B</span>
      <div class="name">MVP ver.2</div>
    </a></li>
    <li><a class="card" href="/c/">
      <span class="tag">C</span>
      <div class="name">MVP ver.3</div>
    </a></li>
  </ul>
</main>
</body>
</html>
